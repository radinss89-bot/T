<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Beta Market</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <div>
            <h1>📈 Beta Market</h1>
            <span id="status">در حال اتصال...</span>
        </div>

        <div class="wallet">
            <span>💰</span>
            <b id="coins">0</b>
        </div>
    </header>


    <!-- MARKET CARD -->
    <section class="market-card">

        <div class="market-top">

            <div>
                <small>بازار</small>
                <h2 id="stockName">BETA</h2>
            </div>

            <div class="price-box">
                <small>قیمت</small>
                <strong id="price">0</strong>
                <span>سکه</span>
            </div>

        </div>


        <!-- CHART -->
        <div class="chart-wrapper">
            <canvas id="chart"></canvas>
        </div>


        <div class="change" id="change">
            0%
        </div>

    </section>


    <!-- BUY / SELL -->
    <section class="trade-card">

        <label>
            تعداد
        </label>

        <div class="amount-row">

            <button onclick="changeAmount(-1)">−</button>

            <input
                id="amount"
                type="number"
                value="1"
                min="1"
            >

            <button onclick="changeAmount(1)">+</button>

        </div>


        <div class="total">
            مجموع:
            <b id="total">0</b>
            سکه
        </div>


        <div class="buttons">

            <button
                class="buy"
                onclick="buyStock()"
            >
                خرید
            </button>

            <button
                class="sell"
                onclick="sellStock()"
            >
                فروش
            </button>

        </div>

    </section>


    <!-- PORTFOLIO -->
    <section class="portfolio">

        <h3>📦 دارایی من</h3>

        <div class="portfolio-row">

            <span>تعداد سهم</span>

            <b id="shares">
                0
            </b>

        </div>

        <div class="portfolio-row">

            <span>ارزش دارایی</span>

            <b id="assetValue">
                0
            </b>

        </div>

    </section>


    <!-- ADMIN -->
    <section
        id="adminPanel"
        class="admin"
        style="display:none;"
    >

        <h3>👑 کنترل بازار</h3>


        <label>
            قیمت جدید
        </label>

        <input
            id="adminPrice"
            type="number"
            min="1"
            placeholder="مثلاً 1500"
        >

        <button onclick="setPrice()">
            تغییر قیمت
        </button>


        <hr>


        <label>
            حداقل تغییر درصدی
        </label>

        <input
            id="minChange"
            type="number"
            value="-10"
        >


        <label>
            حداکثر تغییر درصدی
        </label>

        <input
            id="maxChange"
            type="number"
            value="10"
        >


        <button onclick="setRandomSettings()">
            ذخیره تنظیمات رندوم
        </button>


        <button
            class="random-btn"
            onclick="randomUpdate()"
        >
            🎲 تغییر تصادفی قیمت
        </button>

    </section>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="app.js"></script>

</body>
</html>
