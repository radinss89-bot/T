<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no,orientation=landscape">

<title>Subway Bird</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#10131a;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:min(96vw,520px);
    height:min(92vh,760px);
    max-height:96vh;
    overflow:hidden;
    border-radius:28px;
    background:#171b23;
    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 0 2px rgba(255,255,255,.08);
}

/* =========================
   SKY
========================= */

#sky{
    position:absolute;
    inset:0 0 45% 0;

    background:
        radial-gradient(circle at 20% 25%,rgba(255,255,255,.9) 0 2px,transparent 3px),
        radial-gradient(circle at 75% 18%,rgba(255,255,255,.7) 0 1px,transparent 2px),
        linear-gradient(
            to bottom,
            #151a29 0%,
            #242d46 55%,
            #3c465d 100%
        );
}

/* moon */

#moon{
    position:absolute;
    width:72px;
    height:72px;
    right:35px;
    top:30px;
    border-radius:50%;

    background:#f4f1d0;

    box-shadow:
        0 0 25px rgba(255,245,180,.35),
        0 0 70px rgba(255,245,180,.12);
}

/* =========================
   CITY
========================= */

#city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:45%;
    display:flex;
    align-items:flex-end;
    gap:4px;
    padding:0 5px;
}

.building{
    flex:1;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.12) 0 7px,
            transparent 7px 17px
        ),
        #202532;

    border-radius:3px 3px 0 0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
}

/* =========================
   ROAD
========================= */

#road{
    position:absolute;
    left:0;
    right:0;
    top:29%;
    bottom:0;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #16191f 0%,
            #252a32 16%,
            #30353e 50%,
            #252a32 84%,
            #16191f 100%
        );

    box-shadow:
        inset 15px 0 20px rgba(0,0,0,.25),
        inset -15px 0 20px rgba(0,0,0,.25);
}

/* road center shine */

#road::before{
    content:"";
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:4px;
    height:100%;

    background:rgba(255,255,255,.025);
}

/* =========================
   LANES
========================= */

.lane-line{
    position:absolute;
    top:-100%;
    bottom:-100%;
    width:4px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.55) 0 32px,
            transparent 32px 70px
        );

    filter:drop-shadow(0 0 4px rgba(255,255,255,.15));

    animation:roadMove .7s linear infinite;
}

.line1{
    left:33.33%;
}

.line2{
    left:66.66%;
}

@keyframes roadMove{
    from{transform:translateY(0)}
    to{transform:translateY(70px)}
}

/* =========================
   ROAD EDGES
========================= */

.edge{
    position:absolute;
    top:0;
    bottom:0;
    width:7px;

    background:linear-gradient(
        to bottom,
        #777 0%,
        #ddd 50%,
        #777 100%
    );

    opacity:.45;
}

.edge.left{left:0}
.edge.right{right:0}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    z-index:20;

    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.hud-box{
    min-width:105px;
    padding:10px 14px;

    border-radius:16px;

    background:rgba(10,12,18,.62);
    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);

    color:white;
    text-align:center;

    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.hud-label{
    font-size:10px;
    opacity:.55;
    margin-bottom:3px;
}

.hud-value{
    font-size:20px;
    font-weight:bold;
}

/* =========================
   PLAYER
========================= */

#player{
    position:absolute;
    z-index:10;

    width:65px;
    height:65px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #ff7777 0 8%,
            #f22 25%,
            #bd0000 75%,
            #750000 100%
        );

    box-shadow:
        0 10px 18px rgba(0,0,0,.45),
        inset -7px -8px 12px rgba(0,0,0,.25),
        inset 5px 4px 10px rgba(255,255,255,.2);

    transition:
        left .14s cubic-bezier(.2,.9,.3,1),
        transform .12s ease;
}

#player::after{
    content:"";
    position:absolute;
    width:48px;
    height:12px;
    left:8px;
    bottom:-13px;

    border-radius:50%;

    background:rgba(0,0,0,.35);
    filter:blur(5px);
}

/* eyes */

.eye{
    position:absolute;
    width:18px;
    height:21px;

    top:15px;

    border-radius:50%;

    background:white;

    border:2px solid #111;

    overflow:hidden;
}

.eye.left{
    left:13px;
}

.eye.right{
    right:13px;
}

.eye::after{
    content:"";
    position:absolute;

    width:7px;
    height:9px;

    background:#111;
    border-radius:50%;

    left:5px;
    top:5px;
}

/* brows */

.brow{
    position:absolute;
    width:20px;
    height:5px;

    top:8px;

    background:#111;
    border-radius:5px;
}

.brow.left{
    left:11px;
    transform:rotate(-12deg);
}

.brow.right{
    right:11px;
    transform:rotate(12deg);
}

/* beak */

.beak{
    position:absolute;

    width:0;
    height:0;

    left:50%;
    top:39px;

    transform:translateX(-50%);

    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:19px solid #ffb300;

    filter:drop-shadow(0 2px 1px rgba(0,0,0,.4));
}

/* =========================
   COIN
========================= */

.coin{
    position:absolute;
    z-index:7;

    width:38px;
    height:38px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff 0 7%,
            #eee 8% 18%,
            #bbb 19% 100%
        );

    border:3px solid #888;

    box-shadow:
        0 7px 15px rgba(0,0,0,.35),
        inset 0 0 8px rgba(255,255,255,.8);

    animation:
        coinSpin .65s linear infinite,
        coinGlow 1s ease-in-out infinite alternate;
}

.coin::after{
    content:"🪙";

    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    filter:grayscale(1);
}

@keyframes coinSpin{
    0%{transform:rotateY(0deg)}
    100%{transform:rotateY(360deg)}
}

@keyframes coinGlow{
    from{filter:brightness(.9)}
    to{filter:brightness(1.25)}
}

/* =========================
   OBSTACLE
========================= */

.obstacle{
    position:absolute;
    z-index:7;

    width:54px;
    height:54px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #fafafa,
            #bfc3ca 45%,
            #666b73 100%
        );

    border:3px solid #444;

    box-shadow:
        0 9px 15px rgba(0,0,0,.45),
        inset 4px 4px 8px rgba(255,255,255,.4),
        inset -5px -5px 8px rgba(0,0,0,.25);
}

.obstacle::before{
    content:"";

    position:absolute;
    left:8px;
    right:8px;
    top:10px;
    height:6px;

    border-radius:4px;

    background:#777;

    box-shadow:
        0 14px #777,
        0 28px #777;
}

/* =========================
   SPEED EFFECT
========================= */

.speed-line{
    position:absolute;
    z-index:3;

    width:2px;
    height:45px;

    background:rgba(255,255,255,.15);

    animation:speedLine .5s linear infinite;
}

@keyframes speedLine{
    from{
        transform:translateY(-100px);
        opacity:0;
    }

    20%{opacity:1}

    to{
        transform:translateY(700px);
        opacity:0;
    }
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    position:absolute;
    z-index:100;

    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(4,6,10,.72);
    backdrop-filter:blur(9px);
}

.gameover-card{
    width:82%;
    padding:28px 20px;

    border-radius:25px;

    text-align:center;

    color:white;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 20px 50px rgba(0,0,0,.5);

    animation:pop .25s ease;
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.gameover-title{
    font-size:34px;
    font-weight:900;
    margin-bottom:12px;
}

.gameover-score{
    font-size:22px;
    margin-bottom:7px;
}

.gameover-reward{
    font-size:16px;
    opacity:.8;
    margin-bottom:20px;
}

#restart{
    border:none;

    padding:13px 30px;

    border-radius:15px;

    background:#e31b23;
    color:white;

    font-size:17px;
    font-weight:bold;

    box-shadow:
        0 7px 18px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.25);

    cursor:pointer;
}

#restart:active{
    transform:scale(.94);
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:absolute;
    z-index:30;

    left:0;
    right:0;
    bottom:18px;

    display:flex;
    justify-content:center;
    gap:35px;

    pointer-events:none;
}

.control{
    pointer-events:auto;

    width:68px;
    height:68px;

    border-radius:22px;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(15,17,22,.72);

    backdrop-filter:blur(8px);

    color:white;

    font-size:30px;

    box-shadow:
        0 10px 20px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.12);

    transition:.1s;
}

.control:active{
    transform:scale(.9);
    background:rgba(255,255,255,.15);
}

/* =========================
   FLASH
========================= */

#flash{
    position:absolute;
    z-index:90;
    inset:0;

    pointer-events:none;

    background:white;

    opacity:0;
}

.flash{
    animation:flash .25s ease;
}

@keyframes flash{
    0%{opacity:.8}
    100%{opacity:0}
}

/* =========================
   LANDSCAPE SMALL
========================= */

@media(max-height:520px){

    #game{
        width:min(75vw,500px);
        height:96vh;
    }

    #player{
        width:58px;
        height:58px;
    }

    .control{
        width:55px;
        height:55px;
        border-radius:17px;
    }

    #controls{
        bottom:10px;
        gap:25px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="sky">
        <div id="moon"></div>
        <div id="city"></div>
    </div>

    <div id="road">

        <div class="lane-line line1"></div>
        <div class="lane-line line2"></div>

        <div class="edge left"></div>
        <div class="edge right"></div>

    </div>

    <div id="hud">

        <div class="hud-box">
            <div class="hud-label">امتیاز</div>
            <div class="hud-value" id="score">0</div>
        </div>

        <div class="hud-box">
            <div class="hud-label">رکورد</div>
            <div class="hud-value" id="best">0</div>
        </div>

    </div>

    <div id="player">

        <div class="brow left"></div>
        <div class="brow right"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="beak"></div>

    </div>

    <div id="objects"></div>

    <div id="controls">

        <button class="control" id="leftBtn">◀</button>
        <button class="control" id="rightBtn">▶</button>

    </div>

    <div id="flash"></div>

    <div id="gameOver">

        <div class="gameover-card">

            <div class="gameover-title">
                💥 Game Over
            </div>

            <div class="gameover-score">
                امتیاز: <b id="finalScore">0</b>
            </div>

            <div class="gameover-reward">
                🪙 جایزه: <b id="reward">0</b> کوین
            </div>

            <button id="restart">
                🔄 دوباره بازی کن
            </button>

        </div>

    </div>

</div>

<script>
/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

/* =========================================================
   CONFIG
========================================================= */

const BOT_API_URL = "https://fwlkhy.onrender.com";

const GAME_ID = "subway_bird";

const COIN_MULTIPLIER = 5;

/* =========================================================
   ELEMENTS
========================================================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");
const objectsContainer = document.getElementById("objects");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");
const rewardEl = document.getElementById("reward");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const restartBtn = document.getElementById("restart");

const flash = document.getElementById("flash");

/* =========================================================
   STATE
========================================================= */

let lane = 1;

let score = 0;

let speed = 5;

let running = false;

let objects = [];

let spawnTimer = null;

let animationId = null;

let touchStartX = 0;

let best =
    Number(localStorage.getItem("subway_bird_best") || 0);

bestEl.textContent = best;

/* =========================================================
   CITY
========================================================= */

function createCity(){

    const city = document.getElementById("city");

    city.innerHTML = "";

    for(let i=0;i<24;i++){

        const building = document.createElement("div");

        building.className = "building";

        const height =
            30 + Math.random() * 65;

        building.style.height =
            height + "%";

        city.appendChild(building);
    }
}

/* =========================================================
   SPEED LINES
========================================================= */

function createSpeedLines(){

    for(let i=0;i<12;i++){

        const line =
            document.createElement("div");

        line.className = "speed-line";

        line.style.left =
            (5 + Math.random()*90) + "%";

        line.style.animationDelay =
            (-Math.random()*1.5) + "s";

        line.style.animationDuration =
            (.35 + Math.random()*.5) + "s";

        road.appendChild(line);
    }
}

/* =========================================================
   PLAYER POSITION
========================================================= */

function updatePlayer(){

    const roadWidth = road.clientWidth;

    const laneWidth = roadWidth / 3;

    const x =
        lane * laneWidth +
        laneWidth / 2 -
        player.offsetWidth / 2;

    player.style.left = x + "px";

    player.style.bottom = "115px";
}

/* =========================================================
   MOVE
========================================================= */

function moveLeft(){

    if(!running) return;

    if(lane > 0){

        lane--;

        player.style.transform =
            "scale(.92) rotate(-5deg)";

        setTimeout(()=>{
            player.style.transform =
                "scale(1) rotate(0deg)";
        },120);

        updatePlayer();
    }
}

function moveRight(){

    if(!running) return;

    if(lane < 2){

        lane++;

        player.style.transform =
            "scale(.92) rotate(5deg)";

        setTimeout(()=>{
            player.style.transform =
                "scale(1) rotate(0deg)";
        },120);

        updatePlayer();
    }
}

/* =========================================================
   BUTTONS
========================================================= */

leftBtn.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        moveLeft();
    }
);

rightBtn.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        moveRight();
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key === "ArrowLeft")
            moveLeft();

        if(e.key === "ArrowRight")
            moveRight();

    }
);

/* =========================================================
   SWIPE
========================================================= */

game.addEventListener(
    "touchstart",
    e=>{

        if(!e.touches.length) return;

        touchStartX =
            e.touches[0].clientX;
    },
    {passive:true}
);

game.addEventListener(
    "touchend",
    e=>{

        if(!e.changedTouches.length) return;

        const endX =
            e.changedTouches[0].clientX;

        const diff =
            endX - touchStartX;

        if(Math.abs(diff) < 30)
            return;

        if(diff < 0)
            moveLeft();
        else
            moveRight();

    },
    {passive:true}
);

/* =========================================================
   SPAWN
========================================================= */

function spawnObject(){

    if(!running) return;

    const laneIndex =
        Math.floor(Math.random()*3);

    const isCoin =
        Math.random() < .65;

    const obj =
        document.createElement("div");

    obj.className =
        isCoin ? "coin" : "obstacle";

    const laneWidth =
        road.clientWidth / 3;

    const width =
        isCoin ? 38 : 54;

    const x =
        laneIndex * laneWidth +
        laneWidth / 2 -
        width / 2;

    obj.style.left =
        x + "px";

    obj.style.top =
        "-80px";

    objectsContainer.appendChild(obj);

    objects.push({
        el:obj,
        lane:laneIndex,
        y:-80,
        type:isCoin ? "coin" : "obstacle",
        hit:false
    });
}

/* =========================================================
   COLLISION
========================================================= */

function collision(a,b){

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    return !(
        r1.right < r2.left + 8 ||
        r1.left > r2.right - 8 ||
        r1.bottom < r2.top + 8 ||
        r1.top > r2.bottom - 8
    );
}

/* =========================================================
   COIN SOUND
========================================================= */

function playCoinSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            700,
            ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            1200,
            ctx.currentTime + .08
        );

        gain.gain.setValueAtTime(
            .12,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .15
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + .15);

    }catch(e){}
}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    if(!running)
        return;

    const roadHeight =
        road.clientHeight;

    for(let i=objects.length-1;i>=0;i--){

        const obj = objects[i];

        obj.y += speed;

        obj.el.style.top =
            obj.y + "px";

        if(
            !obj.hit &&
            obj.lane === lane &&
            collision(player,obj.el)
        ){

            obj.hit = true;

            if(obj.type === "coin"){

                score++;

                scoreEl.textContent =
                    score;

                playCoinSound();

                obj.el.remove();

                objects.splice(i,1);

                if(score > best){

                    best = score;

                    bestEl.textContent =
                        best;

                    localStorage.setItem(
                        "subway_bird_best",
                        best
                    );
                }

                speed =
                    Math.min(
                        10,
                        5 + score * .04
                    );

            }else{

                endGame();

                return;
            }
        }

        if(obj.y > roadHeight + 100){

            obj.el.remove();

            objects.splice(i,1);
        }
    }

    animationId =
        requestAnimationFrame(gameLoop);
}

/* =========================================================
   SPAWN LOOP
========================================================= */

function startSpawner(){

    clearInterval(spawnTimer);

    spawnTimer =
        setInterval(
            spawnObject,
            650
        );
}

/* =========================================================
   START GAME
========================================================= */

function startGame(){

    clearInterval(spawnTimer);

    cancelAnimationFrame(animationId);

    objects.forEach(
        o=>o.el.remove()
    );

    objects = [];

    score = 0;

    speed = 5;

    lane = 1;

    running = true;

    scoreEl.textContent = "0";

    gameOverEl.style.display =
        "none";

    flash.classList.remove("flash");

    updatePlayer();

    startSpawner();

    gameLoop();
}

/* =========================================================
   GAME OVER
========================================================= */

async function endGame(){

    if(!running)
        return;

    running = false;

    clearInterval(spawnTimer);

    cancelAnimationFrame(animationId);

    flash.classList.remove("flash");

    void flash.offsetWidth;

    flash.classList.add("flash");

    const reward =
        score * COIN_MULTIPLIER;

    finalScoreEl.textContent =
        score;

    rewardEl.textContent =
        reward;

    gameOverEl.style.display =
        "flex";

    await sendScore(score);
}

/* =========================================================
   SEND SCORE
========================================================= */

async function sendScore(score){

    try{

        const user =
            tg?.initDataUnsafe?.user;

        const userId =
            user?.id || 0;

        const name =
            user
                ? (
                    user.first_name ||
                    user.username ||
                    "Player"
                  )
                : "Player";

        if(!userId){

            console.log(
                "Telegram user not found"
            );

            return;
        }

        const response =
            await fetch(
                `${BOT_API_URL}/game-score`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        user_id:userId,
                        name:name,
                        score:score,
                        game_id:GAME_ID
                    })
                }
            );

        const data =
            await response.json();

        console.log(
            "Game score response:",
            data
        );

    }catch(error){

        console.error(
            "Score sending error:",
            error
        );
    }
}

restartBtn.addEventListener(
    "click",
    ()=>{
        startGame();
    }
);

    ()=>{
        updatePlayer();
