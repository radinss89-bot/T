<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AngryCoin Tap</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#121826;
    touch-action:manipulation;
}

body{
    display:flex;
    flex-direction:column;
    color:white;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    gap:10px;
}

.pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    font-size:15px;
    font-weight:bold;
}

#streakPill{
    background:rgba(255,120,20,.15);
    border-color:rgba(255,150,50,.3);
}

/* =========================
   STATUS BAR
========================= */

#status{
    text-align:center;
    font-size:12px;
    min-height:16px;
    opacity:.75;
    padding:0 16px;
}

/* =========================
   MAIN
========================= */

#main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

#coinCount{
    font-size:46px;
    font-weight:900;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
}

#coinCountLabel{
    font-size:13px;
    opacity:.6;
    margin-bottom:26px;
}

/* =========================
   TAP BUTTON
========================= */

#tapZone{
    position:relative;
    width:min(64vw,260px);
    height:min(64vw,260px);
}

#tapBtn{
    width:100%;
    height:100%;
    border-radius:50%;
    border:none;
    cursor:pointer;

    background:
        radial-gradient(
            circle at 32% 25%,
            #ff8a8a 0 8%,
            #f33 25%,
            #c40000 75%,
            #7a0000 100%
        );

    box-shadow:
        0 18px 40px rgba(255,30,30,.35),
        inset -10px -12px 20px rgba(0,0,0,.3),
        inset 8px 6px 16px rgba(255,255,255,.25);

    font-size:64px;

    transition:transform .08s ease;
}

#tapBtn:active{
    transform:scale(.93);
}

#tapZone.pulse #tapBtn{
    animation:pulse .5s ease;
}

@keyframes pulse{
    0%{box-shadow:0 18px 40px rgba(255,30,30,.35),inset -10px -12px 20px rgba(0,0,0,.3),inset 8px 6px 16px rgba(255,255,255,.25);}
    50%{box-shadow:0 18px 55px rgba(255,80,80,.6),inset -10px -12px 20px rgba(0,0,0,.3),inset 8px 6px 16px rgba(255,255,255,.35);}
    100%{box-shadow:0 18px 40px rgba(255,30,30,.35),inset -10px -12px 20px rgba(0,0,0,.3),inset 8px 6px 16px rgba(255,255,255,.25);}
}

/* floating +1 */

.floatup{
    position:absolute;
    font-size:20px;
    font-weight:bold;
    color:#ffd23f;
    pointer-events:none;
    animation:floatUp .8s ease-out forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-70px);
        opacity:0;
    }
}

/* =========================
   BOTTOM NAV (future games)
========================= */

#bottomNav{
    display:flex;
    border-top:1px solid rgba(255,255,255,.08);
}

.navBtn{
    flex:1;
    padding:14px 6px;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,.55);
    background:none;
    border:none;
}

.navBtn.active{
    color:white;
    font-weight:bold;
}

.navBtn .icon{
    font-size:20px;
    display:block;
    margin-bottom:3px;
}
</style>
</head>

<body>

<div id="topbar">
    <div class="pill" id="walletPill">💰 <span id="walletValue">0</span></div>
    <div class="pill" id="streakPill">🔥 <span id="streakValue">0</span> روز</div>
</div>

<div id="status"></div>

<div id="main">

    <div id="coinCount">🪙 <span id="sessionCoins">0</span></div>
    <div id="coinCountLabel">سکه‌ی این نشست (هنوز ذخیره نشده)</div>

    <div id="tapZone">
        <button id="tapBtn">😠</button>
    </div>

</div>

<div id="bottomNav">
    <button class="navBtn active">
        <span class="icon">🪙</span>
        ضربه‌ای
    </button>
    <button class="navBtn" id="subwayBirdNav">
        <span class="icon">🏃</span>
        Subway Bird
    </button>
</div>

<script>
/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

const user = tg?.initDataUnsafe?.user;
const userId = user?.id || 0;
const userName = user ? (user.first_name || user.username || "Player") : "Player";

/* =========================================================
   CONFIG
========================================================= */

const BOT_API_URL = "https://fwlkhy.onrender.com";

// After this many un-saved taps, flush them to the server.
const BATCH_SIZE = 20;

// Also flush automatically at least this often (ms), so coins
// aren't stuck in limbo if you stop tapping mid-batch.
const FLUSH_INTERVAL_MS = 5000;

const SUBWAY_BIRD_URL = "https://t-pk89.onrender.com";

/* =========================================================
   ELEMENTS
========================================================= */

const statusEl = document.getElementById("status");
const walletValueEl = document.getElementById("walletValue");
const streakValueEl = document.getElementById("streakValue");
const sessionCoinsEl = document.getElementById("sessionCoins");
const tapBtn = document.getElementById("tapBtn");
const tapZone = document.getElementById("tapZone");
const subwayBirdNav = document.getElementById("subwayBirdNav");

/* =========================================================
   STATE
========================================================= */

let walletCoins = 0;      // last known server-confirmed balance
let sessionCoins = 0;     // taps this session (may include unsaved)
let pendingTaps = 0;      // taps not yet sent to the server
let sending = false;

/* =========================================================
   STARTUP CHECKS
========================================================= */

if(!userId){

    statusEl.textContent =
        "⚠️ کاربر تلگرام شناسایی نشد — این بازی رو باید از داخل " +
        "خود تلگرام (دکمه منو یا /play) باز کنی.";

    tapBtn.disabled = true;
    tapBtn.style.opacity = ".4";

}else{

    init();
}

async function init(){

    statusEl.textContent = "در حال اتصال...";

    try{

        const balanceRes = await fetch(
            `${BOT_API_URL}/balance?user_id=${userId}`
        );

        const balanceData = await balanceRes.json();

        if(balanceData.ok){
            walletCoins = balanceData.coins;
            walletValueEl.textContent = walletCoins;
            streakValueEl.textContent = balanceData.streak || 0;
        }

        const checkinRes = await fetch(
            `${BOT_API_URL}/checkin`,
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({user_id:userId, name:userName})
            }
        );

        const checkinData = await checkinRes.json();

        if(checkinData.ok){

            streakValueEl.textContent = checkinData.streak;

            if(checkinData.bonus_awarded > 0){

                walletCoins += checkinData.bonus_awarded;
                walletValueEl.textContent = walletCoins;

                statusEl.textContent =
                    `🔥 استریک ${checkinData.streak} روزه! ` +
                    `+${checkinData.bonus_awarded} کوین جایزه‌ی امروز`;

            }else{

                statusEl.textContent = "✅ متصل شد";

                setTimeout(()=>{
                    if(statusEl.textContent === "✅ متصل شد")
                        statusEl.textContent = "";
                }, 2000);
            }
        }

    }catch(err){

        statusEl.textContent =
            "❌ اتصال به سرور برقرار نشد (شبکه یا CORS).";

        console.error("init error:", err);
    }
}

/* =========================================================
   TAP
========================================================= */

tapBtn.addEventListener("pointerdown", e=>{

    if(!userId) return;

    e.preventDefault();

    sessionCoins++;
    pendingTaps++;

    sessionCoinsEl.textContent = sessionCoins;

    tapZone.classList.remove("pulse");
    void tapZone.offsetWidth;
    tapZone.classList.add("pulse");

    spawnFloatingPlusOne(e);

    if(pendingTaps >= BATCH_SIZE){
        flushTaps();
    }
});

function spawnFloatingPlusOne(e){

    const rect = tapZone.getBoundingClientRect();

    const x = (e.clientX ?? rect.left + rect.width/2) - rect.left;
    const y = (e.clientY ?? rect.top + rect.height/2) - rect.top;

    const el = document.createElement("div");

    el.className = "floatup";
    el.textContent = "+1";
    el.style.left = x + "px";
    el.style.top = y + "px";

    tapZone.appendChild(el);

    setTimeout(()=>el.remove(), 800);
}

/* =========================================================
   FLUSH TAPS TO SERVER
========================================================= */

async function flushTaps(){

    if(sending || pendingTaps <= 0 || !userId)
        return;

    const tapsToSend = pendingTaps;
    pendingTaps = 0;
    sending = true;

    try{

        const res = await fetch(
            `${BOT_API_URL}/tap`,
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    user_id:userId,
                    name:userName,
                    taps:tapsToSend
                })
            }
        );

        const data = await res.json();

        if(data.ok){

            walletCoins = data.coins;
            walletValueEl.textContent = walletCoins;
            statusEl.textContent = "";

        }else{

            // put the taps back so we retry later
            pendingTaps += tapsToSend;

            statusEl.textContent =
                `❌ ذخیره نشد: ${data.error || res.status}`;
        }

    }catch(err){

        pendingTaps += tapsToSend;

        statusEl.textContent =
            "❌ اتصال قطع شد، دوباره تلاش می‌کنم...";

        console.error("flush error:", err);

    }finally{

        sending = false;
    }
}

setInterval(flushTaps, FLUSH_INTERVAL_MS);

// try to flush before the page/app actually closes
document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "hidden"){
        flushTaps();
    }
});

window.addEventListener("pagehide", flushTaps);

/* =========================================================
   NAV (placeholder for more games)
========================================================= */

subwayBirdNav.addEventListener("click", ()=>{

    flushTaps();

    if(tg && tg.openLink){
        tg.openLink(SUBWAY_BIRD_URL);
    }else{
        window.location.href = SUBWAY_BIRD_URL;
    }
});
</script>

</body>
</html>
