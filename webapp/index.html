<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Beta Bird</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
}

body{
    overflow:hidden;
    background:#eee;
    font-family:Arial,sans-serif;
}

#game{
    display:block;
    width:100vw;
    height:100vh;
}


/* =========================
   امتیاز
========================= */

#scoreBox{

    position:fixed;

    top:15px;
    left:15px;

    z-index:5;

    background:white;

    border:3px solid #222;

    border-radius:10px;

    padding:7px 13px;

    color:#222;

    font-size:18px;

    font-weight:bold;

    line-height:1.5;
}


/* =========================
   کنترل
========================= */

#controls{

    position:fixed;

    bottom:25px;

    left:0;
    right:0;

    display:flex;

    justify-content:center;

    gap:35px;

    z-index:10;
}


.btn{

    width:75px;
    height:75px;

    border-radius:50%;

    border:3px solid #222;

    background:white;

    color:#222;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:35px;

    font-weight:bold;

    user-select:none;

}


.btn:active{

    background:#222;

    color:white;

}


/* =========================
   GAME OVER
========================= */

#gameOver{

    position:fixed;

    inset:0;

    background:rgba(255,255,255,.95);

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    z-index:20;

}


#gameOver h1{

    font-size:40px;

    margin-bottom:15px;

}


.result{

    font-size:21px;

    margin:5px;

}


#restart{

    margin-top:20px;

    padding:13px 28px;

    border:3px solid #222;

    border-radius:10px;

    background:#222;

    color:white;

    font-size:18px;

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="scoreBox">

    🪙 <span id="score">0</span>

    <br>

    🏆 رکورد:
    <span id="best">0</span>

</div>


<div id="controls">

    <div class="btn" id="left">
        ←
    </div>

    <div class="btn" id="right">
        →
    </div>

</div>


<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <div class="result">
        🪙 امتیاز:
        <span id="finalScore">0</span>
    </div>

    <div class="result">
        🏆 رکورد:
        <span id="finalBest">0</span>
    </div>

    <button id="restart">
        دوباره بازی
    </button>

</div>


<script>

/* =========================
   Telegram Mini App
========================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if(tg){

    tg.ready();

    tg.expand();

}


/* =========================
   Canvas
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =========================
   بازی
========================= */

let score = 0;

let gameRunning = true;


/* =========================
   رکورد
========================= */

let bestScore =
    Number(
        localStorage.getItem(
            "betaBirdBest"
        )
    ) || 0;


document
    .getElementById("best")
    .textContent =
    bestScore;


/* =========================
   سه لاین
========================= */

let currentLane = 1;


/*
0 = چپ
1 = وسط
2 = راست
*/


function getLaneX(lane){

    const roadLeft = 25;

    const roadWidth =
        canvas.width - 50;

    const laneWidth =
        roadWidth / 3;

    return (
        roadLeft +
        laneWidth * lane +
        laneWidth / 2
    );

}


/* =========================
   پرنده
========================= */

const bird = {

    size:58,

    y:
        canvas.height - 190,

    x:0,

    targetX:0,

    moveSpeed:.25

};


function updateBirdLane(){

    bird.targetX =
        getLaneX(
            currentLane
        )
        -
        bird.size / 2;

}


updateBirdLane();

bird.x =
    bird.targetX;


/* =========================
   تغییر لاین
========================= */

function moveLeft(){

    if(!gameRunning)
        return;

    if(currentLane > 0){

        currentLane--;

        updateBirdLane();

    }

}


function moveRight(){

    if(!gameRunning)
        return;

    if(currentLane < 2){

        currentLane++;

        updateBirdLane();

    }

}


/* =========================
   کنترل موبایل
========================= */

document
    .getElementById("left")
    .addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            moveLeft();

        }
    );


document
    .getElementById("right")
    .addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            moveRight();

        }
    );


/* =========================
   کنترل کامپیوتر
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.repeat)
            return;

        if(e.key === "ArrowLeft")
            moveLeft();

        if(e.key === "ArrowRight")
            moveRight();

    }
);


/* =========================
   سکه‌ها
========================= */

let coins = [];


function spawnCoin(){

    const lane =
        Math.floor(
            Math.random() * 3
        );


    coins.push({

        lane:lane,

        x:getLaneX(lane),

        y:-30,

        radius:13,

        speed:5

    });

}


/* =========================
   موانع
========================= */

let obstacles = [];


function spawnObstacle(){

    const lane =
        Math.floor(
            Math.random() * 3
        );


    obstacles.push({

        lane:lane,

        x:getLaneX(lane),

        y:-50,

        size:42,

        speed:5

    });

}


/* =========================
   تولید
========================= */

setInterval(

    function(){

        if(gameRunning)
            spawnCoin();

    },

    650

);


setInterval(

    function(){

        if(gameRunning)
            spawnObstacle();

    },

    1100

);


/* =========================
   مسیر
========================= */

function drawRoad(){

    /*
    پس زمینه
    */

    ctx.fillStyle="#eee";

    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
    جاده
    */

    ctx.fillStyle="#ccc";

    ctx.fillRect(

        25,
        0,

        canvas.width-50,
        canvas.height

    );


    /*
    دیواره‌ها
    */

    ctx.fillStyle="#888";


    ctx.fillRect(

        20,
        0,

        5,
        canvas.height

    );


    ctx.fillRect(

        canvas.width-25,
        0,

        5,
        canvas.height

    );


    /*
    خطوط سه لاین
    */

    const laneWidth =
        (canvas.width-50)/3;


    ctx.fillStyle="#fff";


    for(
        let i=1;
        i<3;
        i++
    ){

        const x =
            25 +
            laneWidth*i;


        for(
            let y=-100;
            y<canvas.height;
            y+=95
        ){

            ctx.fillRect(

                x-3,
                y,
                6,
                55

            );

        }

    }

}


/* =========================
   پرنده قرمز
   نمای بالا
========================= */

function drawBird(){

    /*
    حرکت نرم
    */

    bird.x +=
        (
            bird.targetX -
            bird.x
        )
        *
        bird.moveSpeed;


    const x =
        bird.x;

    const y =
        bird.y;

    const s =
        bird.size;


    ctx.save();


    ctx.translate(

        x+s/2,
        y+s/2

    );


    /*
    بدن قرمز
    */

    ctx.beginPath();

    ctx.arc(

        0,
        0,

        s/2,

        0,
        Math.PI*2

    );


    ctx.fillStyle="#d22";

    ctx.fill();


    ctx.lineWidth=4;

    ctx.strokeStyle="#222";

    ctx.stroke();


    /*
    پرهای سر
    */

    ctx.fillStyle="#222";


    ctx.beginPath();

    ctx.moveTo(
        -15,
        -25
    );

    ctx.lineTo(
        -5,
        -40
    );

    ctx.lineTo(
        2,
        -25
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        2,
        -25
    );

    ctx.lineTo(
        12,
        -40
    );

    ctx.lineTo(
        17,
        -22
    );

    ctx.fill();


    /*
    چشم‌ها
    */

    ctx.fillStyle="white";


    ctx.beginPath();

    ctx.arc(
        -11,
        -8,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        11,
        -8,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    مردمک
    */

    ctx.fillStyle="#222";


    ctx.beginPath();

    ctx.arc(
        -11,
        -7,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        11,
        -7,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
    ابرو
    */

    ctx.strokeStyle="#222";

    ctx.lineWidth=5;

    ctx.lineCap="round";


    ctx.beginPath();

    ctx.moveTo(
        -20,
        -19
    );

    ctx.lineTo(
        -4,
        -14
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        4,
        -14
    );

    ctx.lineTo(
        20,
        -19
    );

    ctx.stroke();


    /*
    نوک
    */

    ctx.fillStyle="#f2c300";


    ctx.beginPath();

    ctx.moveTo(
        0,
        2
    );

    ctx.lineTo(
        -13,
        13
    );

    ctx.lineTo(
        13,
        13
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle="#222";

    ctx.lineWidth=3;

    ctx.stroke();


    ctx.restore();

}


/* =========================
   سکه
========================= */

function drawCoins(){

    for(
        const c of coins
    ){

        ctx.beginPath();

        ctx.arc(

            c.x,
            c.y,

            c.radius,

            0,
            Math.PI*2

        );


        ctx.fillStyle="white";

        ctx.fill();


        ctx.lineWidth=4;

        ctx.strokeStyle="#222";

        ctx.stroke();


        ctx.fillStyle="#222";

        ctx.font=
            "bold 13px Arial";

        ctx.textAlign="center";


        ctx.fillText(

            "₿",

            c.x,
            c.y+5

        );

    }

}


/* =========================
   موانع
========================= */

function drawObstacles(){

    for(
        const o of obstacles
    ){

        const x =
            o.x-o.size/2;


        ctx.fillStyle="#222";


        ctx.fillRect(

            x,
            o.y,

            o.size,
            o.size

        );


        ctx.fillStyle="#fff";


        ctx.fillRect(

            x+7,
            o.y+8,

            o.size-14,
            7

        );


        ctx.fillRect(

            x+7,
            o.y+27,

            o.size-14,
            7

        );

    }

}


/* =========================
   گرفتن سکه
========================= */

function collectCoins(){

    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const c =
            coins[i];


        const birdCenter =
            bird.y +
            bird.size/2;


        if(

            c.lane ===
            currentLane

            &&

            Math.abs(
                c.y-birdCenter
            ) < 42

        ){

            coins.splice(
                i,
                1
            );


            /*
            هر سکه ۵ امتیاز
            */

            score += 5;


            document
                .getElementById(
                    "score"
                )
                .textContent =
                score;

        }

    }

}


/* =========================
   برخورد
========================= */

function checkCollision(){

    const birdCenter =
        bird.y +
        bird.size/2;


    for(
        const o of obstacles
    ){

        if(

            o.lane ===
            currentLane

            &&

            Math.abs(
                o.y-birdCenter
            ) < 45

        ){

            endGame();

        }

    }

}


/* =========================
   رکورد
========================= */

function updateBest(){

    if(score > bestScore){

        bestScore =
            score;


        localStorage.setItem(

            "betaBirdBest",

            bestScore

        );

    }


    document
        .getElementById(
            "best"
        )
        .textContent =
        bestScore;

}


/* =========================
   ارسال نتیجه به تلگرام
========================= */

function sendScoreToTelegram(){

    if(!tg)
        return;


    const data = {

        action:
            "game_over",

        score:
            score,

        best:
            bestScore

    };


    /*
    اطلاعات بازی
    برای بات ارسال می‌شود
    */

    try{

        tg.sendData(
            JSON.stringify(data)
        );

    }

    catch(error){

        console.log(
            "Telegram error:",
            error
        );

    }

}


/* =========================
   پایان بازی
========================= */

function endGame(){

    if(!gameRunning)
        return;


    gameRunning=false;


    updateBest();


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        score;


    document
        .getElementById(
            "finalBest"
        )
        .textContent =
        bestScore;


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "flex";


    /*
    ارسال نتیجه
    */

    sendScoreToTelegram();

}


/* =========================
   شروع دوباره
========================= */

document
    .getElementById(
        "restart"
    )
    .onclick=function(){

        score=0;

        coins=[];

        obstacles=[];

        currentLane=1;


        updateBirdLane();


        bird.x =
            bird.targetX;


        document
            .getElementById(
                "score"
            )
            .textContent =
            "0";


        document
            .getElementById(
                "gameOver"
            )
            .style.display =
            "none";


        gameRunning=true;

    };


/* =========================
   حلقه بازی
========================= */

function gameLoop(){

    update();


    drawRoad();

    drawCoins();

    drawObstacles();

    drawBird();


    requestAnimationFrame(
        gameLoop
    );

}


function update(){

    if(!gameRunning)
        return;


    /*
    پرنده خودش جلو می‌رود.
    اشیا به سمت پایین می‌آیند.
    */

    for(
        const c of coins
    ){

        c.y += c.speed;

    }


    for(
        const o of obstacles
    ){

        o.y += o.speed;

    }


    /*
    حذف اشیای خارج صفحه
    */

    coins =
        coins.filter(
            c =>
            c.y <
            canvas.height+50
        );


    obstacles =
        obstacles.filter(
            o =>
            o.y <
            canvas.height+60
        );


    collectCoins();

    checkCollision();

}


gameLoop();

</script>

</body>
</html>
