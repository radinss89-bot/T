<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Subway Bird</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: white;
}

/* =========================
   ROAD
========================= */

#road {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    width: min(100vw, 520px);
    height: 100%;

    background: #d8d8d8;

    border-left: 5px solid #555;
    border-right: 5px solid #555;
}

.lane-line {
    position: absolute;

    top: 0;

    width: 4px;
    height: 100%;

    background:
        repeating-linear-gradient(
            to bottom,
            #888 0px,
            #888 35px,
            transparent 35px,
            transparent 70px
        );
}

#line1 {
    left: 33.333%;
}

#line2 {
    left: 66.666%;
}

/* =========================
   SCORE
========================= */

#scoreBox {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    padding: 7px 18px;

    background: white;

    border: 3px solid #222;
    border-radius: 12px;

    font-size: 21px;
    font-weight: bold;
}

#bestBox {
    position: absolute;

    top: 64px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    font-size: 14px;
    font-weight: bold;

    color: #333;
}

/* =========================
   ANGRY BIRD
========================= */

#player {
    position: absolute;

    width: 62px;
    height: 62px;

    z-index: 20;

    transform: translateX(-50%);

    transition: left 0.12s ease;
}

/* بدن قرمز */

.bird {
    position: absolute;

    width: 62px;
    height: 62px;

    background: #e00000;

    border: 4px solid #111;

    border-radius:
        50% 50%
        45% 45%;
}

/* ابروی چپ */

.brow-left {
    position: absolute;

    width: 25px;
    height: 8px;

    background: #111;

    left: 7px;
    top: 11px;

    transform: rotate(18deg);

    border-radius: 5px;

    z-index: 5;
}

/* ابروی راست */

.brow-right {
    position: absolute;

    width: 25px;
    height: 8px;

    background: #111;

    right: 7px;
    top: 11px;

    transform: rotate(-18deg);

    border-radius: 5px;

    z-index: 5;
}

/* چشم‌ها */

.eye {
    position: absolute;

    width: 17px;
    height: 17px;

    background: white;

    border: 3px solid #111;

    border-radius: 50%;

    top: 20px;

    z-index: 4;
}

.eye::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    background: #111;

    border-radius: 50%;

    left: 3px;
    top: 3px;
}

.eye-left {
    left: 11px;
}

.eye-right {
    right: 11px;
}

/* منقار */

.beak {
    position: absolute;

    left: 50%;
    top: 31px;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 14px solid transparent;
    border-right: 14px solid transparent;

    border-top: 20px solid #f2a900;

    filter: drop-shadow(
        0 3px 0 #111
    );

    z-index: 8;
}

/* قسمت بالای سر */

.hair-left {
    position: absolute;

    width: 18px;
    height: 18px;

    background: #111;

    left: 13px;
    top: -7px;

    transform: rotate(-35deg);

    border-radius: 4px;

    z-index: 1;
}

.hair-right {
    position: absolute;

    width: 18px;
    height: 18px;

    background: #111;

    right: 13px;
    top: -7px;

    transform: rotate(35deg);

    border-radius: 4px;

    z-index: 1;
}

/* =========================
   COIN
========================= */

.coin {
    position: absolute;

    width: 31px;
    height: 31px;

    border-radius: 50%;

    background: white;

    border: 4px solid #222;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;
    font-weight: bold;
}

/* =========================
   OBSTACLE
========================= */

.obstacle {
    position: absolute;

    width: 50px;
    height: 50px;

    background: #777;

    border: 4px solid #222;

    border-radius: 8px;

    z-index: 8;
}

/* =========================
   BUTTONS
========================= */

#controls {
    position: absolute;

    bottom: 24px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 60;

    display: flex;

    gap: 20px;
}

.control {
    width: 72px;
    height: 55px;

    background: white;

    border: 3px solid #222;

    border-radius: 12px;

    font-size: 30px;
    font-weight: bold;
}

.control:active {
    background: #ddd;
    transform: scale(.93);
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: rgba(255,255,255,.94);

    text-align: center;
}

#gameOver h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

#finalScore {
    font-size: 22px;
    margin-bottom: 10px;
}

#reward {
    font-size: 18px;
    margin-bottom: 25px;
}

#restart {
    padding: 12px 30px;

    background: white;

    border: 3px solid #222;

    border-radius: 12px;

    font-size: 20px;
    font-weight: bold;
}

</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div id="line1" class="lane-line"></div>
        <div id="line2" class="lane-line"></div>

        <!-- ANGRY BIRD -->

        <div id="player">

            <div class="bird"></div>

            <div class="hair-left"></div>
            <div class="hair-right"></div>

            <div class="brow-left"></div>
            <div class="brow-right"></div>

            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>

            <div class="beak"></div>

        </div>

    </div>


    <div id="scoreBox">
        🏆 <span id="score">0</span>
    </div>

    <div id="bestBox">
        رکورد: <span id="best">0</span>
    </div>


    <div id="controls">

        <button
            class="control"
            id="left">
            ◀
        </button>

        <button
            class="control"
            id="right">
            ▶
        </button>

    </div>


    <div id="gameOver">

        <h1>GAME OVER</h1>

        <div id="finalScore">
            امتیاز: 0
        </div>

        <div id="reward">
            🪙 جایزه: +0 کوین
        </div>

        <button id="restart">
            دوباره بازی
        </button>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================
   ELEMENTS
========================= */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const bestElement =
    document.getElementById("best");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const reward =
    document.getElementById("reward");

const restart =
    document.getElementById("restart");


/* =========================
   VARIABLES
========================= */

let lane = 1;

let score = 0;

let bestScore =
    Number(
        localStorage.getItem(
            "subwayBirdBest"
        )
    ) || 0;

let objects = [];

let gameRunning = true;

let lastSpawn = 0;

let speed = 4;

let animation;


/* =========================
   LANE
========================= */

function getLaneX(number) {

    const laneWidth =
        road.clientWidth / 3;

    return (
        laneWidth * number +
        laneWidth / 2
    );
}


/* =========================
   PLAYER
========================= */

function updatePlayer() {

    player.style.left =
        getLaneX(lane) + "px";

    player.style.top =
        (
            window.innerHeight - 155
        ) + "px";
}

updatePlayer();


/* =========================
   MOVEMENT
========================= */

function moveLeft() {

    if (!gameRunning)
        return;

    if (lane > 0) {

        lane--;

        updatePlayer();
    }
}


function moveRight() {

    if (!gameRunning)
        return;

    if (lane < 2) {

        lane++;

        updatePlayer();
    }
}


/* =========================
   BUTTONS
========================= */

document
    .getElementById("left")
    .addEventListener(
        "click",
        moveLeft
    );

document
    .getElementById("right")
    .addEventListener(
        "click",
        moveRight
    );


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key ===
            "ArrowLeft"
        ) {
            moveLeft();
        }

        if (
            e.key ===
            "ArrowRight"
        ) {
            moveRight();
        }

    }
);


/* =========================
   SWIPE
========================= */

let touchStartX = 0;

game.addEventListener(
    "touchstart",
    function(e) {

        touchStartX =
            e.touches[0].clientX;
    }
);


game.addEventListener(
    "touchend",
    function(e) {

        const endX =
            e.changedTouches[0].clientX;

        const diff =
            endX - touchStartX;

        if (
            Math.abs(diff) < 30
        )
            return;

        if (diff < 0) {

            moveLeft();

        } else {

            moveRight();

        }

    }
);


/* =========================
   COIN
========================= */

function createCoin() {

    const coin =
        document.createElement("div");

    coin.className = "coin";

    coin.textContent = "●";

    const coinLane =
        Math.floor(
            Math.random() * 3
        );

    coin.style.left =
        (
            getLaneX(coinLane) - 15
        ) + "px";

    coin.style.top =
        "-40px";

    road.appendChild(coin);

    objects.push({

        element: coin,

        type: "coin",

        lane: coinLane,

        y: -40

    });
}


/* =========================
   OBSTACLE
========================= */

function createObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    const obstacleLane =
        Math.floor(
            Math.random() * 3
        );

    obstacle.style.left =
        (
            getLaneX(obstacleLane) - 25
        ) + "px";

    obstacle.style.top =
        "-60px";

    road.appendChild(
        obstacle
    );

    objects.push({

        element: obstacle,

        type: "obstacle",

        lane: obstacleLane,

        y: -60

    });
}


/* =========================
   COLLISION
========================= */

function collision(object) {

    const playerTop =
        window.innerHeight - 155;

    const playerBottom =
        playerTop + 62;

    const objectTop =
        object.y;

    const objectBottom =
        object.y +
        object.element.offsetHeight;

    return (
        object.lane === lane &&
        objectBottom > playerTop &&
        objectTop < playerBottom
    );
}


/* =========================
   GAME LOOP
========================= */

function loop(timestamp) {

    if (!gameRunning)
        return;


    /* SPAWN */

    if (
        timestamp - lastSpawn >
        700
    ) {

        if (
            Math.random() < .65
        ) {

            createCoin();

        } else {

            createObstacle();

        }

        lastSpawn = timestamp;
    }


    /* OBJECTS */

    for (
        let i = objects.length - 1;
        i >= 0;
        i--
    ) {

        const object =
            objects[i];

        object.y += speed;

        object.element.style.top =
            object.y + "px";


        /* COLLISION */

        if (
            collision(object)
        ) {

            if (
                object.type ===
                "obstacle"
            ) {

                endGame();

                return;
            }


            if (
                object.type ===
                "coin"
            ) {

                score++;

                scoreElement.textContent =
                    score;

                object.element.remove();

                objects.splice(
                    i,
                    1
                );

                continue;
            }
        }


        /* REMOVE */

        if (
            object.y >
            window.innerHeight + 100
        ) {

            object.element.remove();

            objects.splice(
                i,
                1
            );
        }
    }


    /* SPEED */

    speed =
        4 + score * .03;


    animation =
        requestAnimationFrame(
            loop
        );
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    if (!gameRunning)
        return;

    gameRunning = false;

    cancelAnimationFrame(
        animation
    );


    /* BEST */

    if (
        score > bestScore
    ) {

        bestScore =
            score;

        localStorage.setItem(
            "subwayBirdBest",
            bestScore
        );
    }


    bestElement.textContent =
        bestScore;


    finalScore.textContent =
        "امتیاز: " + score;


    reward.textContent =
        "🪙 جایزه: +" +
        (score * 5) +
        " کوین";


    gameOverScreen.style.display =
        "flex";


    /* =========================
       SEND DATA TO BOT
    ========================= */

    try {

        let gameId;

        if (
            window.crypto &&
            crypto.randomUUID
        ) {

            gameId =
                crypto.randomUUID();

        } else {

            gameId =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2);

        }


        tg.sendData(

            JSON.stringify({

                action:
                    "game_over",

                score:
                    score,

                best:
                    bestScore,

                game_id:
                    gameId

            })

        );

        console.log(
            "GAME DATA SENT:",
            score
        );

    } catch (error) {

        console.error(
            "SEND DATA ERROR:",
            error
        );

    }
}


/* =========================
   RESTART
========================= */

restart.addEventListener(
    "click",
    function() {

        location.reload();

    }
);


/* =========================
   START
========================= */

bestElement.textContent =
    bestScore;

setTimeout(
    function() {

        updatePlayer();

        animation =
            requestAnimationFrame(
                loop
            );

    },
    300
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    updatePlayer
);

</script>

</body>
</html>
