<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>papt pipt poptMarket</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <h1>📈 p³ Market</h1>
            <span class="status">● آنلاین</span>
        </div>

        <div class="wallet-box">
            <span>موجودی</span>
            <strong id="wallet">...</strong>
            <small>🪙 کوین</small>
        </div>
    </header>


    <main>

        <!-- MARKET -->

        <section class="card market-card">

            <div class="market-header">
                <div>
                    <span class="label">بازار</span>
                    <h2 id="stockName">BETA</h2>
                </div>

                <div class="price-box">
                    <span id="price">...</span>
                    <small>🪙</small>
                </div>
            </div>

            <div class="change" id="change">
                در حال دریافت...
            </div>

            <canvas id="chart"></canvas>

        </section>


        <!-- TRADE -->

        <section class="card">

            <h2>معامله</h2>

            <div class="amount-box">
                <label>تعداد</label>

                <input
                    id="amount"
                    type="number"
                    min="1"
                    value="1"
                    inputmode="numeric"
                >
            </div>

            <div class="buttons">

                <button
                    id="buyBtn"
                    class="buy"
                    onclick="buyStock()"
                >
                    🟢 خرید
                </button>

                <button
                    id="sellBtn"
                    class="sell"
                    onclick="sellStock()"
                >
                    🔴 فروش
                </button>

            </div>

        </section>


        <!-- PORTFOLIO -->

        <section class="card">

            <h2>دارایی من</h2>

            <div class="portfolio">

                <div>
                    <span>تعداد BETA</span>
                    <strong id="shares">0</strong>
                </div>

                <div>
                    <span>ارزش دارایی</span>
                    <strong id="portfolioValue">0</strong>
                </div>

            </div>

        </section>


        <!-- ADMIN -->

        <section
            id="adminPanel"
            class="card admin"
            style="display:none;"
        >

            <h2>⚙️ پنل مدیریت</h2>

            <label>قیمت جدید</label>

            <input
                id="adminPrice"
                type="number"
                min="1"
            >

            <button onclick="changePrice()">
                تغییر قیمت
            </button>


            <hr>

            <label>حداقل تغییر درصد</label>

            <input
                id="minChange"
                type="number"
                value="-10"
            >

            <label>حداکثر تغییر درصد</label>

            <input
                id="maxChange"
                type="number"
                value="10"
            >

            <button onclick="changeRandomSettings()">
                ذخیره تنظیمات
            </button>

        </section>

    </main>

</div>


<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
