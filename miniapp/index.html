<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>pupt pipt poptMarket</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div>
            <div class="logo">p³</div>
            <div class="subtitle">بازار مجازی</div>
        </div>

        <div class="status">
            <span></span>
            آنلاین
        </div>

    </header>


    <!-- WALLET -->

    <section class="wallet-card">

        <div class="wallet-title">
            موجودی شما
        </div>

        <div class="wallet-value">
            <span id="wallet">...</span>
        </div>

        <div class="coin-label">
            🪙 کوین
        </div>

    </section>


    <!-- MARKET -->

    <section class="market-card">

        <div class="market-top">

            <div>
                <div class="market-name" id="marketName">
                    BetaCoin
                </div>

                <div class="market-desc">
                    قیمت لحظه‌ای
                </div>
            </div>

            <div
                class="market-change"
                id="marketChange"
            >
                --
            </div>

        </div>


        <div
            class="price"
            id="price"
        >
            ...
        </div>


        <div class="chart">

            <canvas
                id="chart"
                width="700"
                height="250"
            ></canvas>

        </div>

    </section>


    <!-- PORTFOLIO -->

    <section class="portfolio">

        <div class="section-title">
            دارایی من
        </div>

        <div class="portfolio-grid">

            <div class="info-box">

                <span>
                    مقدار
                </span>

                <strong id="holding">
                    ...
                </strong>

            </div>


            <div class="info-box">

                <span>
                    ارزش دارایی
                </span>

                <strong id="holdingValue">
                    ...
                </strong>

            </div>

        </div>

    </section>


    <!-- TRADE -->

    <section class="trade">

        <div class="section-title">
            معامله
        </div>


        <div class="amount-box">

            <label>
                مقدار
            </label>

            <input
                id="amount"
                type="number"
                min="0.01"
                step="0.01"
                value="1"
                placeholder="مثلاً 1"
            >

        </div>


        <div class="trade-buttons">

            <button
                id="buyBtn"
                class="buy"
            >
                خرید
            </button>

            <button
                id="sellBtn"
                class="sell"
            >
                فروش
            </button>

        </div>

    </section>


    <!-- ADMIN -->

    <section
        id="adminPanel"
        class="admin"
        style="display:none;"
    >

        <div class="section-title">
            پنل مدیریت
        </div>


        <div class="admin-box">

            <label>
                قیمت جدید
            </label>

            <input
                id="adminPrice"
                type="number"
                min="0.01"
                step="0.01"
            >

            <button id="setPriceBtn">
                تغییر قیمت
            </button>

        </div>


        <div class="admin-box">

            <label>
                حداقل تغییر درصدی
            </label>

            <input
                id="minChange"
                type="number"
                value="-5"
            >

            <label>
                حداکثر تغییر درصدی
            </label>

            <input
                id="maxChange"
                type="number"
                value="5"
            >

            <label class="switch-row">

                <span>
                    تغییر خودکار
                </span>

                <input
                    id="autoChange"
                    type="checkbox"
                    checked
                >

            </label>

            <button id="saveSettingsBtn">
                ذخیره تنظیمات
            </button>

        </div>

    </section>


    <div
        id="message"
        class="message"
    ></div>


    <footer>
        Beta Market
    </footer>

</div>


<script src="app.js"></script>

</body>
</html>
