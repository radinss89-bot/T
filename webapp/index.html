<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>Subway Bird</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    margin: 0;
    background: #eee;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 500px;
    margin: auto;
    background: #ddd;
    overflow: hidden;
}

#road {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            #ccc 0%,
            #ccc 8%,
            #aaa 8%,
            #aaa 92%,
            #ccc 92%,
            #ccc 100%
        );
}

.lane-line {
    position: absolute;
    top: 0;
    width: 4px;
    height: 100%;
    background: #eee;
}

#line1 {
    left: 33.33%;
}

#line2 {
    left: 66.66%;
}

#player {
    position: absolute;
    width: 64px;
    height: 64px;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.body {
    position: absolute;
    width: 54px;
    height: 54px;
    left: 5px;
    top: 5px;
    border-radius: 50%;
    background: #d22;
}

.eye {
    position: absolute;
    width: 17px;
    height: 22px;
    background: white;
    border-radius: 50%;
    top: 14px;
}

.eye.left {
    left: 12px;
}

.eye.right {
    right: 12px;
}

.pupil {
    position: absolute;
    width: 7px;
    height: 9px;
    background: #111;
    border-radius: 50%;
    top: 7px;
    left: 5px;
}

.beak {
    position: absolute;
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 25px solid #e99b00;
    right: -3px;
    top: 29px;
}

.brow {
    position: absolute;
    width: 25px;
    height: 7px;
    background: #111;
    top: 7px;
    border-radius: 5px;
}

.brow.left {
    left: 8px;
    transform: rotate(12deg);
}

.brow.right {
    right: 8px;
    transform: rotate(-12deg);
}

.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    border: 5px solid #777;
    z-index: 5;
}

.obstacle {
    position: absolute;
    width: 55px;
    height: 55px;
    background: #555;
    border-radius: 8px;
    z-index: 5;
}

#score {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 20;
    font-size: 22px;
    font-weight: bold;
}

#best {
    position: absolute;
    top: 48px;
    left: 18px;
    z-index: 20;
    font-size: 15px;
}

#gameover {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.75);
    color: white;
    z-index: 50;
}

#gameover h1 {
    font-size: 36px;
}

button {
    border: none;
    background: #fff;
    color: #111;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 15px;
}

#status {
    margin-top: 12px;
    font-size: 14px;
    text-align: center;
    max-width: 280px;
}

.controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 30;
}

.controls button {
    width: 70px;
    height: 55px;
    padding: 0;
    font-size: 25px;
    opacity: .8;
}

</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div
        class="lane-line"
        id="line1"
    ></div>

    <div
        class="lane-line"
        id="line2"
    ></div>

    <div id="score">
        🏆 0
    </div>

    <div id="best">
        رکورد: 0
    </div>

    <div id="player">

        <div class="body"></div>

        <div class="brow left"></div>
        <div class="brow right"></div>

        <div class="eye left">
            <div class="pupil"></div>
        </div>

        <div class="eye right">
            <div class="pupil"></div>
        </div>

        <div class="beak"></div>

    </div>

    <div class="controls">

        <button id="left">
            ◀
        </button>

        <button id="right">
            ▶
        </button>

    </div>

    <div id="gameover">

        <h1>GAME OVER</h1>

        <div id="finalScore">
            امتیاز: 0
        </div>

        <div id="reward">
            🪙 جایزه: 0
        </div>

        <div id="status">
            در حال ثبت نتیجه...
        </div>

        <button id="restart">
            دوباره بازی
        </button>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// ==================================================
// IMPORTANT
// آدرس Render سرویس رباتت را اینجا بگذار
// مثال:
// https://mybot.onrender.com
// ==================================================

const BOT_API_URL = "https://fwlkhy.onrender.com/";


const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

const gameover = document.getElementById("gameover");
const finalScore = document.getElementById("finalScore");
const reward = document.getElementById("reward");
const statusText = document.getElementById("status");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");
const restartButton = document.getElementById("restart");


let lane = 1;
let score = 0;

let running = false;

let speed = 5;

let objects = [];

let spawnTimer = 0;

let lastTime = 0;


// ==================================================
// LOCAL BEST
// ==================================================

let bestScore = Number(
    localStorage.getItem("subway_bird_best") || 0
);

bestText.textContent =
    "رکورد: " + bestScore;


// ==================================================
// PLAYER
// ==================================================

function updatePlayer() {

    const laneWidth =
        game.clientWidth / 3;

    const x =
        laneWidth * lane +
        laneWidth / 2;

    player.style.left =
        x + "px";
}


// ==================================================
// MOVE
// ==================================================

function moveLeft() {

    if (!running)
        return;

    if (lane > 0) {

        lane--;

        updatePlayer();
    }
}


function moveRight() {

    if (!running)
        return;

    if (lane < 2) {

        lane++;

        updatePlayer();
    }
}


leftButton.addEventListener(
    "click",
    moveLeft
);

rightButton.addEventListener(
    "click",
    moveRight
);


document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "ArrowLeft")
            moveLeft();

        if (e.key === "ArrowRight")
            moveRight();

    }
);


// ==================================================
// SWIPE
// ==================================================

let touchX = 0;

game.addEventListener(
    "touchstart",
    function(e) {

        touchX =
            e.touches[0].clientX;

    }
);

game.addEventListener(
    "touchend",
    function(e) {

        const x =
            e.changedTouches[0].clientX;

        const diff =
            x - touchX;

        if (Math.abs(diff) < 30)
            return;

        if (diff < 0)
            moveLeft();
        else
            moveRight();

    }
);


// ==================================================
// CREATE COIN
// ==================================================

function createCoin(laneNumber) {

    const coin =
        document.createElement("div");

    coin.className = "coin";

    const laneWidth =
        game.clientWidth / 3;

    coin.style.left =
        (
            laneWidth * laneNumber +
            laneWidth / 2 -
            14
        ) + "px";

    coin.style.top = "-40px";

    game.appendChild(coin);

    objects.push({
        el: coin,
        lane: laneNumber,
        y: -40,
        type: "coin"
    });
}


// ==================================================
// CREATE OBSTACLE
// ==================================================

function createObstacle(laneNumber) {

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    const laneWidth =
        game.clientWidth / 3;

    obstacle.style.left =
        (
            laneWidth * laneNumber +
            laneWidth / 2 -
            27
        ) + "px";

    obstacle.style.top = "-70px";

    game.appendChild(obstacle);

    objects.push({
        el: obstacle,
        lane: laneNumber,
        y: -70,
        type: "obstacle"
    });
}


// ==================================================
// COLLISION
// ==================================================

function collision(a, b) {

    const ar =
        a.getBoundingClientRect();

    const br =
        b.getBoundingClientRect();

    return !(
        ar.right < br.left ||
        ar.left > br.right ||
        ar.bottom < br.top ||
        ar.top > br.bottom
    );
}


// ==================================================
// GAME LOOP
// ==================================================

function loop(timestamp) {

    if (!running)
        return;

    const delta =
        timestamp - lastTime;

    lastTime = timestamp;

    spawnTimer += delta;

    if (spawnTimer > 650) {

        spawnTimer = 0;

        const randomLane =
            Math.floor(
                Math.random() * 3
            );

        if (Math.random() < .65)
            createCoin(randomLane);
        else
            createObstacle(randomLane);
    }


    for (
        let i = objects.length - 1;
        i >= 0;
        i--
    ) {

        const obj =
            objects[i];

        obj.y +=
            speed *
            (delta / 16.67);

        obj.el.style.top =
            obj.y + "px";


        // collision
        if (
            obj.lane === lane &&
            collision(
                player,
                obj.el
            )
        ) {

            if (
                obj.type === "coin"
            ) {

                score++;

                scoreText.textContent =
                    "🏆 " + score;

                obj.el.remove();

                objects.splice(
                    i,
                    1
                );

                continue;

            } else {

                endGame();

                return;
            }
        }


        // remove
        if (
            obj.y >
            game.clientHeight + 100
        ) {

            obj.el.remove();

            objects.splice(
                i,
                1
            );
        }
    }


    // difficulty
    speed =
        5 +
        Math.min(
            score * .03,
            5
        );


    requestAnimationFrame(loop);
}


// ==================================================
// START
// ==================================================

function startGame() {

    objects.forEach(
        obj => obj.el.remove()
    );

    objects = [];

    lane = 1;
    score = 0;
    speed = 5;
    spawnTimer = 0;

    updatePlayer();

    scoreText.textContent =
        "🏆 0";

    bestText.textContent =
        "رکورد: " + bestScore;

    gameover.style.display =
        "none";

    statusText.textContent =
        "";

    running = true;

    lastTime =
        performance.now();

    requestAnimationFrame(loop);
}


// ==================================================
// SEND SCORE
// ==================================================

async function sendScore(score) {

    const telegramUser =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;

    if (!telegramUser) {

        throw new Error(
            "Telegram user not found"
        );
    }


    // ساخت شناسه یکتا
    const gameId =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2);


    const response =
        await fetch(
            BOT_API_URL +
            "/game-score",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    user_id:
                        telegramUser.id,

                    name:
                        telegramUser.first_name ||
                        "کاربر",

                    score:
                        score,

                    game_id:
                        gameId
                })
            }
        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.ok
    ) {

        throw new Error(
            data.error ||
            "ثبت نتیجه ناموفق بود"
        );
    }


    return data;
}


// ==================================================
// GAME OVER
// ==================================================

async function endGame() {

    if (!running)
        return;

    running = false;

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "subway_bird_best",
            bestScore
        );
    }


    finalScore.textContent =
        "🏆 امتیاز: " + score;

    reward.textContent =
        "🪙 جایزه: " +
        (score * 5) +
        " کوین";

    gameover.style.display =
        "flex";

    statusText.textContent =
        "⏳ در حال ثبت جایزه...";


    try {

        const result =
            await sendScore(score);


        reward.textContent =
            "🪙 +" +
            result.coins_awarded +
            " کوین";

        statusText.textContent =
            "✅ جایزه به موجودیت اضافه شد!";

    } catch (error) {

        console.error(
            "GAME SCORE ERROR:",
            error
        );

        statusText.textContent =
            "❌ ثبت جایزه ناموفق بود.";
    }
}


// ==================================================
// RESTART
// ==================================================

restartButton.addEventListener(
    "click",
    startGame
);


// ==================================================
// INIT
// ==================================================

updatePlayer();

startGame();

</script>

</body>
</html>
